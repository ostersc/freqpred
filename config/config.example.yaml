# freqpred configuration template
# Copy to config/config.yaml and fill in values.
# Secrets (API keys) must come from environment variables — never put them here.

log_level: "INFO"  # DEBUG | INFO | WARNING | ERROR
# log_module_levels:  # per-module overrides; env: LOG_MODULE_LEVELS=module=LEVEL,module=LEVEL
#   freqpred.ingestion.fetchers.gdelt: DEBUG

database:
  # Overridden by DATABASE_URL env var
  url: ""

kalshi:
  # Production endpoint (default). Overridden by KALSHI_BASE_URL env var.
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  # Demo endpoint (simulated funds, separate credentials required):
  # base_url: "https://demo-api.kalshi.co/trade-api/v2"

  # Production credentials. Overridden by KALSHI_API_KEY / KALSHI_PRIVATE_KEY_PATH env vars.
  api_key: ""
  private_key_path: ""  # path to RSA private key (.pem) from Kalshi account settings

  # Demo credentials (separate Kalshi demo account required).
  # Overridden by KALSHI_DEMO_API_KEY / KALSHI_DEMO_PRIVATE_KEY_PATH env vars.
  demo_api_key: ""
  demo_private_key_path: ""

  polling_interval_seconds: 300

anthropic:
  # Overridden by ANTHROPIC_API_KEY env var
  api_key: ""
  primary_model: "claude-sonnet-4-6"
  cheap_model: "claude-haiku-4-5-20251001"

tavily:
  # Overridden by TAVILY_API_KEY env var
  api_key: ""
  daily_cap: 33                   # 1,000 credits/month ÷ 30 days
  min_fetch_interval_hours: 1.0   # floor on per-market interval regardless of market count

newsapi:
  # Overridden by NEWSAPI_KEY env var
  api_key: ""
  min_fetch_interval_hours: 1.0   # floor on per-market interval; hard limit is max_window_requests

guardian:
  # Free developer key: https://open-platform.theguardian.com/access/
  # Overridden by GUARDIAN_API_KEY env var
  api_key: ""
  enabled: true
  daily_cap: 490                  # Guardian free tier allows 500/day; leave 10 headroom
  min_fetch_interval_hours: 1.0   # floor on per-market interval regardless of market count

reddit:
  # Uses the public Reddit JSON API — no credentials required
  user_agent: "freqpred/0.1"

truthsocial:
  # Overridden by TRUTHSOCIAL_USERNAME / TRUTHSOCIAL_PASSWORD env vars
  username: ""
  password: ""

ingestion:
  schedule_interval_seconds: 1800  # 30 minutes
  truthsocial:
    enabled: false
    accounts: []
    # accounts:
    #   - username: realDonaldTrump
    #     categories: [politics]

signal:
  top_k_documents: 10
  staleness_multiplier: 3  # polling_interval × 3 before market is considered stale

risk:
  max_position_pct: 0.05         # 5% of bankroll per market
  max_daily_loss_pct: 0.15       # 15% daily loss circuit breaker
  max_total_exposure_pct: 0.40   # 40% max simultaneous exposure
  min_edge_floor: 0.10           # absolute minimum edge to place any trade
  max_open_positions: 20
  max_daily_llm_spend_usd: 10.0  # LLM budget circuit breaker

trading:
  bankroll_usd: 1000.0   # capital budget for this deployment; trading mode is set via --mode CLI flag

dashboard:
  host: "0.0.0.0"
  port: 8000

alerts:
  # Overridden by TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID / DISCORD_WEBHOOK_URL env vars
  telegram_bot_token: ""
  telegram_chat_id: ""
  # Telegram usernames or numeric user IDs allowed to send bot commands.
  # Empty list = no one can send commands.
  telegram_authorized_users: []
  discord_webhook_url: ""

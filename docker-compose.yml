services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: freqpred
      POSTGRES_USER: freqpred
      POSTGRES_PASSWORD: freqpred
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freqpred"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:

name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff
        run: uv run ruff check .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://freqpred:freqpred@localhost:5432/freqpred_test
          ANTHROPIC_API_KEY: dummy
          KALSHI_API_KEY: dummy
          TAVILY_API_KEY: dummy
          NEWSAPI_KEY: dummy

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: freqpred_test
          POSTGRES_USER: freqpred
          POSTGRES_PASSWORD: freqpred
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freqpred"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://freqpred:freqpred@localhost:5432/freqpred_test

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://freqpred:freqpred@localhost:5432/freqpred_test
          ANTHROPIC_API_KEY: dummy
          KALSHI_API_KEY: dummy
          TAVILY_API_KEY: dummy
          NEWSAPI_KEY: dummy
